apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: krz-tech-portfolio
  namespace: argocd
spec:
  writeBackConfig:
    method: git
    gitConfig:
      repository: https://github.com/kurazuuuuuu/krz-tech-portfolio.git
      branch: main
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: krz-tech-portfolio
      commonUpdateSettings:
        updateStrategy: digest
        pullSecret: pullsecret:argocd/ghcr-registry-secret
      images:
        - alias: krz-tech-portfolio
          imageName: ghcr.io/kurazuuuuuu/krz-tech-portfolio:latest
