apiVersion: apps/v1
kind: Deployment
metadata:
  name: krz-tech-portfolio
  namespace: argocd-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: krz-tech-portfolio
  template:
    metadata:
      labels:
        app: krz-tech-portfolio
    spec:
      imagePullSecrets:
        - name: ghcr-registry-secret
      containers:
        - name: krz-tech-portfolio
          image: ghcr.io/kurazuuuuuu/krz-tech-portfolio:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: krz-tech-portfolio-lb
  namespace: argocd-prod
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 80
  selector:
    app: krz-tech-portfolio
  type: LoadBalancer
  loadBalancerIP: 192.168.1.21
